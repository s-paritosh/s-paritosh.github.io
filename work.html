<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Selected Work | Paritosh Sharma</title>
<!-- Canonical points to the bare root, not the fragment: Google generally
     ignores everything after # when resolving a canonical, so the indexable
     URL is the root page, not "/#selected-work". -->
<link rel="canonical" href="https://s-paritosh.github.io/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://s-paritosh.github.io/#selected-work">
<script>
window.location.replace('/#selected-work');
</script>
</head>
<body>
<!-- Visible fallback for the rare visitor with both JS and meta-refresh blocked. -->
<p>This page has moved. <a href="https://s-paritosh.github.io/#selected-work">Continue to Selected Work &rarr;</a></p>
</body>
</html>
